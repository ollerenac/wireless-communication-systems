name: Publicar sitio del curso

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales de Git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Cache de dependencias
        run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar examen de diseño y mapas de Colab
        run: python scripts/verify-exam-colab.py

      - name: Verificar construcción estricta del sitio
        run: mkdocs build --strict

      - name: Construir y publicar sitio
        run: mkdocs gh-deploy --force
